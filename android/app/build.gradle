plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.vrstreetview'
    compileSdk 34

    defaultConfig {
        applicationId "com.vrstreetview"
        minSdk 31          // Quest 3 ships with Android 12L (API 32); min 31 covers Quest Pro and Quest 3
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Google Maps API key — override in local.properties or via CI secret
        manifestPlaceholders = [
            googleMapsKey: project.findProperty('GOOGLE_MAPS_KEY') ?: ''
        ]

        // Server URL — override with your production HTTPS URL in local.properties:
        //   VR_SERVER_URL=https://your-deployment.example.com
        buildConfigField "String", "VR_SERVER_URL",
            "\"${project.findProperty('VR_SERVER_URL') ?: 'http://10.0.2.2:3000'}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        // Strip native debug symbols not needed at runtime
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    // AndroidX core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'com.google.android.material:material:1.11.0'

    // Lifecycle / ViewModel
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Google Maps SDK (includes Street View Panorama)
    implementation 'com.google.android.gms:play-services-maps:18.2.0'

    // HTTP client for tile/API requests
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Image loading (for panorama thumbnails in the 2-D UI)
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Unit tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.2.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
