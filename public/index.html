<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pano — Quest 3</title>
  <meta name="description" content="Immersive Google Street View VR projection for Meta Quest 3">

  <!-- A-Frame WebXR library (served locally to avoid external SSL dependencies) -->
  <script src="js/aframe.min.js"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ─── 2-D UI overlay (hidden when in VR) ──────────────────────────────── -->
  <div id="ui-overlay">
    <div id="input-row">
      <input
        type="text"
        id="url-input"
        placeholder="Panorama URL"
        autocomplete="off"
      />
      <button id="load-btn" aria-label="Load panorama">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40" fill="currentColor" aria-hidden="true">
          <path d="M20.5 7h-17C2.12 7 1 8.12 1 9.5v5C1 15.88 2.12 17 3.5 17h3.08c.46 0 .89-.24 1.13-.63L9 14.5h6l1.29 1.87c.24.39.67.63 1.13.63H20.5c1.38 0 2.5-1.12 2.5-2.5v-5C23 8.12 21.88 7 20.5 7zm-11 5c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm7 0c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2z"/>
        </svg>
      </button>
    </div>

    <p id="vr-hint">Joystick left/right to turn, up/down to zoom in/out; B to ask AI (joystick up/down to scroll); A to show location name; X to quit immersive mode.</p>

    <div id="language-row">
      <label for="ai-language">AI should respond in:</label>
      <select id="ai-language">
        <option value="English" selected>English</option>
        <option value="Spanish">Español</option>
        <option value="French">Français</option>
        <option value="German">Deutsch</option>
        <option value="Italian">Italiano</option>
        <option value="Portuguese">Português</option>
        <option value="Chinese">中文</option>
        <option value="Japanese">日本語</option>
        <option value="Korean">한국어</option>
        <option value="Russian">Русский</option>
        <option value="Arabic">العربية</option>
        <option value="Hindi">हिन्दी</option>
        <option value="Bengali">বাংলা</option>
        <option value="Turkish">Türkçe</option>
        <option value="Vietnamese">Tiếng Việt</option>
        <option value="Thai">ไทย</option>
        <option value="Dutch">Nederlands</option>
        <option value="Polish">Polski</option>
        <option value="Indonesian">Bahasa Indonesia</option>
        <option value="Swedish">Svenska</option>
      </select>
    </div>

    <div id="status-bar" class="hidden"></div>
  </div>

  <!-- ─── A-Frame VR Scene ────────────────────────────────────────────────── -->
  <!-- The scene is always in the DOM so A-Frame/WebGL initialises with proper
       dimensions; the UI overlay (z-index:100) covers it until a panorama loads. -->
  <a-scene
    id="vr-scene"
    renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true; highRefreshRate: true; foveationLevel: 0"
    xr-mode-ui="enabled: false"
    loading-screen="dotsColor: #fff; backgroundColor: #1a1a2e"
    embedded
  >
    <!-- Asset management -->
    <a-assets id="assets" timeout="30000">
      <!-- The panorama canvas is generated dynamically in JS -->
      <canvas id="panorama-canvas" width="4096" height="2048" crossorigin="anonymous"></canvas>
    </a-assets>

    <!-- Panorama sphere — the main Street View projection -->
    <a-sky
      id="panorama-sky"
      src="#panorama-canvas"
      rotation="0 -90 0"
      material="shader: flat; side: back"
    ></a-sky>

    <!-- Loading indicator (shown inside VR while fetching tiles) -->
    <a-entity id="vr-loading" visible="false">
      <a-text
        value="Loading panorama…"
        align="center"
        color="#ffffff"
        position="0 1.6 -3"
        scale="1.5 1.5 1.5"
      ></a-text>
    </a-entity>

    <!-- In-VR location label -->
    <a-entity id="location-label">
      <a-text
        id="location-text"
        value=""
        align="center"
        color="#ffffff"
        position="0 -0.3 -3"
        scale="0.8 0.8 0.8"
        material="shader: flat"
      ></a-text>
    </a-entity>

    <!-- Navigation links to adjacent Street View panoramas -->
    <a-entity id="nav-links"></a-entity>

    <!-- Camera rig with Quest 3 head tracking + optional controller navigation -->
    <a-entity id="camera-rig" position="0 0 0" vr-controller-input>
      <a-camera
        id="main-camera"
        look-controls="reverseMouseDrag: true; touchEnabled: true; magicWindowTrackingEnabled: true"
        wasd-controls="enabled: false"
        fov="90"
      >
        <!-- Gaze cursor for controller-free navigation (no visible reticle) -->
        <a-entity
          id="gaze-cursor"
          cursor="fuse: true; fuseTimeout: 1500; rayOrigin: entity"
          position="0 0 -0.75"
          raycaster="objects: .nav-arrow; interval: 100; showLine: false"
        ></a-entity>
      </a-camera>

      <!-- Left Quest 3 controller (tracking only — model hidden) -->
      <a-entity
        id="left-hand"
        oculus-touch-controls="hand: left; model: false"
        raycaster="objects: .nav-arrow; showLine: false"
      ></a-entity>

      <!-- Right Quest 3 controller (tracking only — model hidden) -->
      <a-entity
        id="right-hand"
        oculus-touch-controls="hand: right; model: false"
        raycaster="objects: .nav-arrow; showLine: false"
      ></a-entity>
    </a-entity>
  </a-scene>

  <!-- App scripts -->
  <script src="js/street-view-service.js"></script>
  <script src="js/panorama-components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
